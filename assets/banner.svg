<svg width="100%" height="100%" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#26DE81" />
      <stop offset="100%" stop-color="#39FF14" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F0F6FC" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E131A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="12%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="88%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Circuit Grid Pattern -->
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Outer Canvas with Border -->
  <rect width="1200" height="340" rx="14" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.2" />
  
  <!-- Subtle Dot Grid Overlay -->
  <rect width="1200" height="340" rx="14" fill="url(#dotGrid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="340" fill="url(#glowLeft)" />
  <rect width="1200" height="340" fill="url(#glowRight)" />

  <!-- Decorative Circuit Traces - Left -->
  <g stroke="#21262D" stroke-width="1.2" fill="none">
    <path d="M 40 170 L 120 170 L 160 120 L 250 120" />
    <path d="M 120 170 L 160 220 L 230 220" />
    <path d="M 160 120 L 195 70 L 260 70" />
    <path d="M 60 85 L 120 85 L 160 120" stroke="#00F0FF" stroke-opacity="0.35" stroke-dasharray="3,3" />
    <path d="M 70 255 L 130 255 L 160 220" stroke="#39FF14" stroke-opacity="0.3" stroke-dasharray="3,3" />
  </g>

  <!-- Circuit Nodes - Left -->
  <circle cx="160" cy="120" r="4.5" fill="#00F0FF" />
  <circle cx="250" cy="120" r="3.5" fill="#39FF14" />
  <circle cx="160" cy="220" r="4" fill="#00F0FF" />
  <circle cx="230" cy="220" r="3" fill="#39FF14" />
  <circle cx="195" cy="70" r="3.5" fill="#00F0FF" />

  <!-- Decorative Circuit Traces - Right -->
  <g stroke="#21262D" stroke-width="1.2" fill="none">
    <path d="M 1160 170 L 1080 170 L 1040 120 L 950 120" />
    <path d="M 1080 170 L 1040 220 L 970 220" />
    <path d="M 1040 120 L 1005 70 L 940 70" />
    <path d="M 1140 85 L 1080 85 L 1040 120" stroke="#39FF14" stroke-opacity="0.35" stroke-dasharray="3,3" />
    <path d="M 1130 255 L 1070 255 L 1040 220" stroke="#00F0FF" stroke-opacity="0.3" stroke-dasharray="3,3" />
  </g>

  <!-- Circuit Nodes - Right -->
  <circle cx="1040" cy="120" r="4.5" fill="#39FF14" />
  <circle cx="950" cy="120" r="3.5" fill="#00F0FF" />
  <circle cx="1040" cy="220" r="4" fill="#39FF14" />
  <circle cx="970" cy="220" r="3" fill="#00F0FF" />
  <circle cx="1005" cy="70" r="3.5" fill="#39FF14" />

  <!-- Top System Header Bar -->
  <g transform="translate(60, 24)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#39FF14" />
    <text x="26" y="17" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="700" fill="#39FF14" letter-spacing="1">SYSTEM_ONLINE</text>

    <!-- Node identification -->
    <rect x="172" y="0" width="220" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="188" y="17" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#8B949E">NODE://</text>
    <text x="234" y="17" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="700" fill="#00F0FF">adityar2216v.sys</text>

    <!-- Domain Pill (Right) -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="240" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="16" y="17" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#8B949E">FOCUS: </text>
      <text x="68" y="17" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="700" fill="#00F0FF">GenAI · Full-Stack</text>
    </g>
  </g>

  <!-- Accent Divider -->
  <path d="M 60 66 L 1140 66" stroke="url(#borderGlow)" stroke-width="1.2" />

  <!-- Hero Identity Block -->
  <g transform="translate(600, 142)" text-anchor="middle">
    <!-- Eyebrow Pill -->
    <rect x="-180" y="-48" width="360" height="24" rx="12" fill="#161B22" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="-32" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="2">
      // FULL-STACK &amp; AI SYSTEMS ARCHITECT //
    </text>

    <!-- Main Name Title -->
    <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      ADITYA RAJ SRIVASTAVA
    </text>

    <!-- Precision Subtitle -->
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#C9D1D9" letter-spacing="0.3">
      Founding CTO @ <tspan fill="#00F0FF" font-weight="700">Resiqra</tspan>  ·  Founder @ <tspan fill="#39FF14" font-weight="700">Coders Era (5,000+ Devs)</tspan>  ·  DSA in Java &amp; Systems
    </text>
  </g>

  <!-- Bottom Metric Telemetry HUD Strip (5 Equidistant Balanced Cards) -->
  <g transform="translate(85, 256)">
    <!-- Card 1: Production Deployments -->
    <g transform="translate(0, 0)">
      <rect width="190" height="56" rx="10" fill="url(#cardBg)" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="800" fill="#00F0FF">6 DEPLOYMENTS</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#8B949E">Production Verified</text>
    </g>

    <!-- Card 2: Community -->
    <g transform="translate(210, 0)">
      <rect width="190" height="56" rx="10" fill="url(#cardBg)" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="800" fill="#39FF14">5,000+ DEVS</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#8B949E">Coders Era Founder</text>
    </g>

    <!-- Card 3: Inference Speed -->
    <g transform="translate(420, 0)">
      <rect width="190" height="56" rx="10" fill="url(#cardBg)" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="800" fill="#00F0FF">&lt; 200ms</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#8B949E">LLM Dialogue Latency</text>
    </g>

    <!-- Card 4: LeetCode DSA -->
    <g transform="translate(630, 0)">
      <rect width="190" height="56" rx="10" fill="url(#cardBg)" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="800" fill="#39FF14">150+ SOLVED</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#8B949E">LeetCode DSA in Java</text>
    </g>

    <!-- Card 5: Academics & GPA -->
    <g transform="translate(840, 0)">
      <rect width="190" height="56" rx="10" fill="url(#cardBg)" stroke="#30363D" stroke-width="1" />
      <text x="16" y="26" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="800" fill="#00F0FF">8.0 CGPA</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#8B949E">CSE '28 · NIET Greater Noida</text>
    </g>
  </g>
</svg>
