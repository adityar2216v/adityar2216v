<svg width="100%" height="100%" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyanGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#26DE81" />
      <stop offset="100%" stop-color="#39FF14" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0E131A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#39FF14" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="meshGlowLeft" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshGlowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.5" fill="#00F0FF" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulseNode {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.9; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    
    @keyframes scanline {
      0% { transform: translateY(-360px); }
      100% { transform: translateY(360px); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#21262D" stroke-width="1.5" />
  
  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#circuitGrid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="360" fill="url(#meshGlowLeft)" />
  <rect width="1200" height="360" fill="url(#meshGlowRight)" />

  <!-- Geometric Circuit Network & Data Nodes -->
  <!-- Left Side Network -->
  <g stroke="#1F293D" stroke-width="1.5" fill="none">
    <path d="M 40 180 L 110 180 L 160 130 L 260 130" />
    <path d="M 110 180 L 160 230 L 240 230" />
    <path d="M 160 130 L 200 70 L 280 70" />
    <path d="M 60 90 L 120 90 L 160 130" stroke="#00F0FF" stroke-opacity="0.4" stroke-dasharray="4,4" />
    <path d="M 80 270 L 140 270 L 160 230" stroke="#39FF14" stroke-opacity="0.3" stroke-dasharray="4,4" />
  </g>

  <!-- Left Nodes -->
  <circle cx="160" cy="130" r="5" fill="#00F0FF" filter="url(#subtleGlow)" />
  <circle cx="260" cy="130" r="4" fill="#39FF14" />
  <circle cx="160" cy="230" r="4" fill="#00F0FF" />
  <circle cx="240" cy="230" r="3.5" fill="#39FF14" />
  <circle cx="200" cy="70" r="4" fill="#00F0FF" />
  <circle cx="280" cy="70" r="3.5" fill="#26DE81" />

  <!-- Right Side Network (Distributed Nodes) -->
  <g stroke="#1F293D" stroke-width="1.5" fill="none">
    <path d="M 1160 180 L 1090 180 L 1040 130 L 940 130" />
    <path d="M 1090 180 L 1040 230 L 960 230" />
    <path d="M 1040 130 L 1000 70 L 920 70" />
    <path d="M 1140 90 L 1080 90 L 1040 130" stroke="#39FF14" stroke-opacity="0.4" stroke-dasharray="4,4" />
    <path d="M 1120 270 L 1060 270 L 1040 230" stroke="#00F0FF" stroke-opacity="0.3" stroke-dasharray="4,4" />
  </g>

  <!-- Right Nodes -->
  <circle cx="1040" cy="130" r="5" fill="#39FF14" filter="url(#subtleGlow)" />
  <circle cx="940" cy="130" r="4" fill="#00F0FF" />
  <circle cx="1040" cy="230" r="4" fill="#39FF14" />
  <circle cx="960" cy="230" r="3.5" fill="#00F0FF" />
  <circle cx="1000" cy="70" r="4" fill="#39FF14" />
  <circle cx="920" cy="70" r="3.5" fill="#00F0FF" />

  <!-- Top System Header Bar -->
  <g transform="translate(60, 28)">
    <!-- Terminal status pill -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#39FF14" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19" class="font-mono" font-size="11" font-weight="700" fill="#39FF14" letter-spacing="1">SYSTEM_ONLINE</text>

    <!-- Node identification -->
    <rect x="192" y="0" width="230" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="208" y="19" class="font-mono" font-size="11" font-weight="600" fill="#8B949E">NODE://</text>
    <text x="256" y="19" class="font-mono" font-size="11" font-weight="700" fill="#00F0FF">adityar2216v.sys</text>

    <!-- Right Side Telemetry Pills -->
    <g transform="translate(860, 0)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="16" y="19" class="font-mono" font-size="11" font-weight="600" fill="#8B949E">STACK: </text>
      <text x="68" y="19" class="font-mono" font-size="11" font-weight="700" fill="#00F0FF">GenAI · Full-Stack</text>
    </g>
  </g>

  <!-- Horizontal Glow Divider -->
  <path d="M 60 74 L 1140 74" stroke="url(#glowLine)" stroke-width="1.5" />

  <!-- Center Content Area -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Architecture Tag -->
    <rect x="-190" y="-46" width="380" height="26" rx="13" fill="#161B22" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1" />
    <text x="0" y="-29" class="font-mono" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="2">
      // FULL-STACK &amp; AI SYSTEMS ARCHITECT //
    </text>

    <!-- Main Title -->
    <text x="0" y="24" class="font-sans" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      ADITYA RAJ SRIVASTAVA
    </text>

    <!-- Dynamic Subtitle -->
    <text x="0" y="58" class="font-sans" font-size="16" font-weight="600" fill="#C9D1D9" letter-spacing="0.5">
      Founding CTO @ <tspan fill="#00F0FF" font-weight="700">Resiqra</tspan>  ·  Founder @ <tspan fill="#39FF14" font-weight="700">Coders Era (5k+ Devs)</tspan>  ·  DSA &amp; Distributed Systems
    </text>
  </g>

  <!-- Bottom Metric Telemetry Strip -->
  <g transform="translate(90, 275)">
    <!-- Metric 1: Deployments -->
    <g transform="translate(0, 0)">
      <rect width="185" height="52" rx="10" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
      <text x="18" y="24" class="font-mono" font-size="16" font-weight="800" fill="#00F0FF">6 DEPLOYS</text>
      <text x="18" y="42" class="font-mono" font-size="10" font-weight="600" fill="#8B949E">Production Systems</text>
    </g>

    <!-- Metric 2: Community -->
    <g transform="translate(205, 0)">
      <rect width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
      <text x="18" y="24" class="font-mono" font-size="16" font-weight="800" fill="#39FF14">5,000+ DEVS</text>
      <text x="18" y="42" class="font-mono" font-size="10" font-weight="600" fill="#8B949E">Coders Era Community</text>
    </g>

    <!-- Metric 3: Latency & Speed -->
    <g transform="translate(420, 0)">
      <rect width="185" height="52" rx="10" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
      <text x="18" y="24" class="font-mono" font-size="16" font-weight="800" fill="#00F0FF">&lt; 200ms</text>
      <text x="18" y="42" class="font-mono" font-size="10" font-weight="600" fill="#8B949E">LLM Inference Latency</text>
    </g>

    <!-- Metric 4: LeetCode -->
    <g transform="translate(625, 0)">
      <rect width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
      <text x="18" y="24" class="font-mono" font-size="16" font-weight="800" fill="#39FF14">150+ SOLVED</text>
      <text x="18" y="42" class="font-mono" font-size="10" font-weight="600" fill="#8B949E">LeetCode DSA in Java</text>
    </g>

    <!-- Metric 5: Academics & Scale -->
    <g transform="translate(840, 0)">
      <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
      <text x="18" y="24" class="font-mono" font-size="16" font-weight="800" fill="#00F0FF">8.0 CGPA</text>
      <text x="18" y="42" class="font-mono" font-size="10" font-weight="600" fill="#8B949E">CSE '28 · NIET Noida</text>
    </g>
  </g>
</svg>
